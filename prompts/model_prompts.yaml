# Model Agent Prompts
# 用于模型训练和评估相关的 LLM 调用

training_plan_generation: |
  你是一位 AutoML 专家。请根据以下信息设计模型训练方案。

  ## 建模任务
  - 任务类型：{task_type}
  - 目标变量：{target_column}
  - 业务描述：{description}

  ## 数据信息
  - 样本数量：{n_samples}
  - 特征数量：{n_features}
  - 数据信息：{data_info}

  ## 数据特征列名
  {feature_columns}

  请设计一个完整的模型训练方案。返回 JSON 格式，包含以下字段：

  ```json
  {{
      "model_choice": {{
          "selected_models": ["LightGBM", "RandomForest", "Ridge"],
          "reasoning": "选择这些模型的理由"
      }},
      "data_split": {{
          "train_ratio": 0.8,
          "test_ratio": 0.2,
          "random_state": 42,
          "split_method": "random"
      }},
      "evaluation_metrics": {{
          "primary_metric": "rmse",
          "secondary_metrics": ["mae", "r2"]
      }},
      "hyperparameters": {{
          "LightGBM": {{"n_estimators": 100, "max_depth": 5, "learning_rate": 0.1, "num_leaves": 31}},
          "RandomForest": {{"n_estimators": 100, "max_depth": 10, "min_samples_split": 5}},
          "Ridge": {{"alpha": 1.0}}
      }}
  }}
  ```

  **重要约束**：
  1. selected_models 必须是简单字符串列表，如 ["LightGBM", "RandomForest"]
  2. hyperparameters 的值必须是具体数值/字符串，不能是列表或字典
  3. 不要返回超参数搜索空间，只返回具体参数值
  4. random_state 必须是整数，如 42
  5. train_ratio 和 test_ratio 必须是浮点数，如 0.8

  只返回 JSON，不要其他内容。

training_plan_modification: |
  你是一位 AutoML 专家。用户想要修改模型训练方案。

  {memory_context}

  当前训练方案:
  {plan}

  用户反馈：{feedback}

  请根据用户反馈，生成修改后的训练方案。保持 JSON 格式。

model_selection_recommendation: |
  你是一位机器学习专家。请根据以下数据特征推荐合适的模型。

  ## 任务信息
  - 任务类型：{task_type}
  - 样本数量：{n_samples}
  - 特征数量：{n_features}
  - 业务场景：{business_context}

  ## 数据特征
  - 数值特征：{numeric_features}
  - 类别特征：{categorical_features}
  - 目标变量分布：{target_distribution}

  请推荐 3-5 个适合的模型，并说明理由。返回 JSON 格式：
  {{
      "recommended_models": [
          {{
              "name": "模型名称",
              "reasoning": "推荐理由",
              "suitable_for": "适用场景"
          }}
      ]
  }}
