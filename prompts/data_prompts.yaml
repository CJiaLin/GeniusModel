# Data Agent Prompts
# 用于数据处理相关的 LLM 调用

data_quality_analysis: |
  你是一位数据质量分析专家。请分析以下数据的质量情况。

  ## 数据基本信息
  - 数据形状：{data_shape}
  - 列名：{columns}
  - 数据类型：{dtypes}

  ## 缺失值情况
  {missing_info}

  ## 重复值情况
  {duplicate_info}

  ## 异常值检测
  {outlier_info}

  请评估数据质量，并提供清洗建议。返回 JSON 格式：
  {{
      "quality_score": 0-100,
      "main_issues": ["主要问题 1", "主要问题 2"],
      "recommendations": ["建议 1", "建议 2"],
      "critical_columns": ["需要重点关注的列"]
  }}

cleaning_strategy_generation: |
  你是一位数据处理专家。根据以下数据质量问题，生成清洗策略。

  ## 数据质量报告
  {quality_report}

  ## 业务背景
  {business_context}

  ## 建模目标
  {modeling_goal}

  请生成详细的数据清洗策略，包括：
  1. 缺失值处理方案
  2. 异常值处理方案
  3. 重复值处理方案
  4. 数据类型转换建议

  返回 JSON 格式：
  {{
      "missing_strategy": {{
          "method": "fill/drop",
          "details": "详细说明"
      }},
      "outlier_strategy": {{
          "method": "remove/cap/transform",
          "details": "详细说明"
      }},
      "duplicate_strategy": {{
          "method": "remove/keep",
          "details": "详细说明"
      }},
      "column_transformations": [
          {{
              "column": "列名",
              "transformation": "转换操作",
              "reason": "原因"
          }}
      ]
  }}

data_exploration_summary: |
  你是一位数据分析专家。请对以下数据进行探索性分析总结。

  ## 数据统计信息
  {statistics}

  ## 数据分布
  {distributions}

  ## 相关性分析
  {correlations}

  请总结数据的关键特征和潜在洞察，包括：
  1. 数据的基本特点
  2. 值得注意的模式
  3. 可能的问题或风险
  4. 对建模的建议

  返回简洁的分析报告（文本格式）。
