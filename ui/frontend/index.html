<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoML 对话式工作流</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="app" class="flex h-screen">
        <!-- 左侧会话列表 -->
        <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-4 border-b border-gray-700">
                <h1 class="text-xl font-bold text-white">🤖 AutoML</h1>
            </div>
            <div class="p-2">
                <button id="newChatBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center justify-center gap-2 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    新建会话
                </button>
            </div>
            <div id="sessionList" class="flex-1 overflow-y-auto">
                <!-- 会话列表项 -->
            </div>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="flex-1 flex flex-col">
            <!-- 顶部配置栏 -->
            <header class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <span class="text-gray-400 text-sm">API 配置:</span>
                    <input type="password" id="apiKey" placeholder="API Key" class="bg-gray-700 border border-gray-600 rounded px-3 py-1 text-sm focus:outline-none focus:border-blue-500">
                    <input type="text" id="apiBaseUrl" value="http://localhost:8001" placeholder="API Base URL" class="bg-gray-700 border border-gray-600 rounded px-3 py-1 text-sm w-48 focus:outline-none focus:border-blue-500">
                    <input type="text" id="modelName" value="kimi-k2-0905-preview" placeholder="Model" class="bg-gray-700 border border-gray-600 rounded px-3 py-1 text-sm w-48 focus:outline-none focus:border-blue-500">
                </div>
                <button id="saveConfigBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded text-sm transition-colors">
                    保存配置
                </button>
            </header>

            <!-- 对话和工作流区域 -->
            <div class="flex-1 flex overflow-hidden">
                <!-- 对话区 -->
                <div class="flex-1 flex flex-col">
                    <div id="chatContainer" class="flex-1 overflow-y-auto p-6 space-y-4">
                        <!-- 欢迎消息 -->
                        <div class="flex gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0">
                                <span class="text-white text-sm">🤖</span>
                            </div>
                            <div class="bg-gray-800 rounded-lg px-4 py-3 max-w-[80%]">
                                <p class="text-gray-300">欢迎使用 AutoML 对话式建模系统！</p>
                                <p class="text-gray-400 text-sm mt-2">请先在左侧新建一个会话，然后可以：</p>
                                <ul class="text-gray-400 text-sm mt-1 list-disc list-inside">
                                    <li>上传数据文件</li>
                                    <li>描述建模需求</li>
                                    <li>查看工作流执行状态</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- 输入区 -->
                    <div class="p-4 border-t border-gray-700">
                        <div id="dataUploadSection" class="mb-3 p-3 bg-gray-800 rounded-lg">
                            <div class="flex items-center gap-3">
                                <input type="file" id="dataFile" accept=".csv,.xlsx" class="text-sm text-gray-400">
                                <select id="targetColumn" class="bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm">
                                    <option value="">选择目标列</option>
                                </select>
                                <button id="loadDataBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm">
                                    加载数据
                                </button>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <textarea id="messageInput" rows="3" placeholder="描述您的建模需求..." class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 resize-none"></textarea>
                            <button id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 工作流可视化区 -->
                <div class="w-96 border-l border-gray-700 bg-gray-800 flex flex-col">
                    <div class="p-4 border-b border-gray-700">
                        <h2 class="font-semibold text-white">工作流状态</h2>
                    </div>
                    <div id="workflowContainer" class="flex-1 overflow-y-auto p-4">
                        <div id="workflowNodes" class="space-y-3">
                            <!-- 工作流节点 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/workflow.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
