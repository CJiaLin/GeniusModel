# LLM Configuration
# 大模型配置，支持多种 LLM 提供商

# 默认使用的模型
default_model: "qwen3.6-plus" # "qwen3.6-plus"

# 模型配置
models:
  # Moonshot (月之暗面) - 使用 OpenAI 兼容接口
  # 注意: kimi-k2.5 只支持 temperature=1
  kimi-k2.5:
    provider: "openai"
    model_name: "kimi-k2.5"
    temperature: 1.0
    max_tokens: 65536
    timeout: 120
    api_key: "sk-fzRoH8YfHjSDBcaGooMErOVBKsl9frstezHVRGIP3UBgFOUa" # "${MOONSHOT_API_KEY}"
    base_url: "https://api.moonshot.cn/v1"

  claude-opus-4-6:
    provider: "openai"
    model_name: "claude-opus-4-6"
    temperature: 1.0
    max_tokens: 65536
    timeout: 600000
    api_key: "sk-UbK2DTVQKLO0G5_j9vT2vLxAT6NUWx3mrY4JWfh3C0M" # "${MOONSHOT_API_KEY}"
    base_url: "https://api.cloubic.com/v1"

  qwen3.6-plus:
    provider: "openai"
    model_name: "qwen3.6-plus"
    temperature: 1.0
    max_tokens: 65536
    timeout: 120
    api_key: "sk-2ff94cd887604e60baeb2ef66f58fad0" # "${MOONSHOT_API_KEY}"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

# 各阶段使用的模型（可以覆盖默认模型）
stage_models:
  data_analysis: "qwen3.6-plus"        # 数据分析阶段
  data_cleaning: "qwen3.6-plus"       # 数据清洗阶段
  feature_engineering: "qwen3.6-plus"  # 特征工程阶段
  model_training: "qwen3.6-plus"       # 模型训练阶段
  report_generation: "qwen3.6-plus"    # 报告生成阶段
  code_generation: "qwen3.6-plus"      # 代码生成阶段

# 各阶段 max_tokens 覆盖（精简输出，减少生成时间）
stage_max_tokens:
  data_cleaning: 8192
  data_cleaning_plan: 4096
  code_generation: 8192

# 日志配置
logging:
  enabled: true
  log_dir: "logs/llm_calls"
  log_format: "jsonl"
  log_level: "INFO"
  max_file_size: "100MB"
  max_backup_files: 10

# 流式输出配置
streaming:
  enabled: true
  chunk_size: 100
  timeout: 300

# 重试配置
retry:
  max_retries: 3
  retry_delay: 1.0
  exponential_backoff: true
  max_delay: 60.0

# 限流配置
rate_limit:
  enabled: false
  requests_per_minute: 60
  tokens_per_minute: 100000
